async function saveVisual(){
 if(!visualSelected){$('visualStatus').textContent='Seleziona prima un elemento.';return}
 const key=visualPage+'::'+visualSelected;
 const patch=visualPatchFromControls();
 const next={...siteData,_visual_styles:{...visualStyles,[key]:patch}};
 const button=$('saveVisual');
 button.disabled=true;
 $('visualStatus').textContent='Salvataggio su Test…';
 try{
  const w=await db.from('site_content').update({content_value:next,updated_at:new Date().toISOString()}).eq('content_key','public_site').select('content_key').single();
  if(w.error)throw w.error;
  const v=await db.from('site_content').select('content_value').eq('content_key','public_site').single();
  if(v.error)throw v.error;
  siteData=v.data.content_value||{};
  visualStyles=siteData._visual_styles||{};
  if(!Object.prototype.hasOwnProperty.call(visualStyles,key))throw new Error('La regola non risulta presente dopo la rilettura dal database Test.');
  const saved=visualStyles[key];
  if(Object.keys(patch).some(k=>saved[k]!==patch[k]))throw new Error('La rilettura dal database non conferma tutte le proprietà richieste.');
  $('visualStatus').textContent='Salvataggio verificato. Ricarico la Preview…';
  const frame=$('visualFrame');
  const url=visualPreviewUrl()+'?visual-editor=1&visualPage='+encodeURIComponent(visualPage)+'&lang=it&v='+Date.now();
  const reportPromise=new Promise((resolve,reject)=>{
   let finished=false;
   const finish=(fn,value)=>{if(finished)return;finished=true;clearTimeout(timer);window.removeEventListener('message',handler);fn(value)};
   const timer=setTimeout(()=>finish(reject,new Error('La Preview non ha restituito il rapporto di applicazione entro 15 secondi.')),15000);
   const handler=ev=>{
    if(ev.source!==frame.contentWindow||ev.data?.type!=='nf-visual-load-report')return;
    finish(resolve,ev.data.report||{});
   };
   window.addEventListener('message',handler);
   frame.src=url;
  });
  const report=await reportPromise;
  if(report.error)throw new Error('Errore caricamento stili: '+report.error);
  if((report.missing||[]).includes(key))throw new Error('La regola è salvata, ma il selettore non è stato trovato nella Preview: '+visualSelected);
  if(!(report.applied>0))throw new Error('La Preview non conferma l’applicazione di alcuna regola.');
  $('visualStatus').textContent='Salvato su Test e riapplicato alla Preview ✓ ('+report.applied+'/'+report.total+')';
  say('Stile salvato, riletto e applicato nella Preview.');
 }catch(e){
  $('visualStatus').textContent='VERIFICA NON RIUSCITA: '+e.message;
  say('Stile non confermato: '+e.message);
 }finally{button.disabled=false}
}
async function loadImages(){say('Caricamento immagini…');try{const r=await db.from('site_images').select('*').order('sort_order');if(r.error)throw r.error;images=r.data||[];$('page-images').innerHTML='<div class="notice">Sostituisci un’immagine caricando un nuovo file sullo slot esistente. Il file precedente non viene eliminato. Formati: JPG, PNG, WebP, GIF.</div><div class="media-grid" style="margin-top:14px">'+images.map(im=>'<div class="media-card"><img src="'+esc(mediaUrl(im.image_path))+'" alt=""><b>'+esc(im.label)+'</b><small>'+esc(im.image_key)+' · '+esc(im.category)+'</small><label>Testo alternativo</label><input data-alt="'+esc(im.image_key)+'" value="'+esc(im.alt_text||'')+'"><label>Sostituisci immagine</label><input type="file" accept="image/*" data-image-file="'+esc(im.image_key)+'"><button class="primary" data-save-image="'+esc(im.image_key)+'" style="margin-top:9px;width:100%">Salva slot</button></div>').join('')+'</div>';images.forEach(im=>{$('[data-save-image="'+im.image_key+'"]').onclick=()=>saveSiteImage(im)})}catch(e){say('Errore immagini: '+e.message)}}
async function saveSiteImage(im){const input=$('[data-image-file="'+im.image_key+'"]'),alt=$('[data-alt="'+im.image_key+'"]').value.trim(),file=input.files?.[0];if(!file&&!alt){say('Scegli un’immagine o modifica il testo alternativo.');return}const b=$('[data-save-image="'+im.image_key+'"]');b.disabled=true;try{let path=im.image_path;if(file){if(!file.type.startsWith('image/'))throw new Error('Il file selezionato non è un’immagine.');path=filePath('site-'+im.image_key+'-'+file.name);const u=await db.storage.from('site-media').upload(path,file,{contentType:file.type,upsert:false,cacheControl:'31536000'});if(u.error)throw u.error}const w=await db.from('site_images').update({image_path:path,alt_text:alt,updated_at:new Date().toISOString(),updated_by:user.id}).eq('image_key',im.image_key).select('image_key,image_path,alt_text').single();if(w.error)throw w.error;const v=await db.from('site_images').select('image_path,alt_text').eq('image_key',im.image_key).single();if(v.error)throw v.error;if(v.data.image_path!==path||v.data.alt_text!==alt)throw new Error('Verifica di rilettura non riuscita.');say('Immagine '+im.label+' salvata e verificata.');await loadImages()}catch(e){say('Errore salvataggio immagine: '+e.message)}finally{b.disabled=false}}
async function loadGallery(){say('Caricamento galleria…');try{const r=await db.from('gallery_images').select('*').order('category').order('sort_order');if(r.error)throw r.error;gallery=r.data||[];$('page-gallery').innerHTML='<div class="section"><h3>Aggiungi fotografia</h3><div class="grid2"><div><label>Titolo / nome file</label><input id="gTitle"></div><div><label>Categoria</label><select id="gCategory"><option value="restaurant">Ristorante</option><option value="kitchen">Cucina</option><option value="music">Musica</option></select></div><div><label>Ordine</label><input id="gOrder" type="number" value="10"></div><div><label>Immagine</label><input id="gFile" type="file" accept="image/*"></div></div><button class="primary" id="gAdd" style="margin-top:12px">Carica in galleria</button></div><div class="media-grid">'+gallery.map(x=>'<div class="media-card"><img src="'+esc(mediaUrl(x.image_path))+'" alt=""><b>'+esc(x.title||'Fotografia')+'</b><small>'+esc(x.category)+' · ordine '+x.sort_order+' · '+(x.is_published?'Pubblicata':'Bozza')+'</small><div class="actions"><button data-g-toggle="'+x.id+'">'+(x.is_published?'Nascondi':'Pubblica')+'</button><button class="danger" data-g-delete="'+x.id+'">Elimina record</button></div></div>').join('')+'</div>';$('gAdd').onclick=addGallery;gallery.forEach(x=>{$('[data-g-toggle="'+x.id+'"]').onclick=()=>toggleGallery(x);$('[data-g-delete="'+x.id+'"]').onclick=()=>deleteGallery(x)})}catch(e){say('Errore galleria: '+e.message)}}
async function addGallery(){const file=$('gFile').files?.[0];if(!file){say('Seleziona un’immagine.');return}const b=$('gAdd');b.disabled=true;try{const path=filePath('gallery-'+file.name);const u=await db.storage.from('site-media').upload(path,file,{contentType:file.type,upsert:false});if(u.error)throw u.error;const w=await db.from('gallery_images').insert({title:$('gTitle').value||file.name,category:$('gCategory').value,image_path:path,sort_order:Number($('gOrder').value)||0,is_published:false,translations:{}}).select('id,image_path').single();if(w.error)throw w.error;const v=await db.from('gallery_images').select('id,image_path').eq('id',w.data.id).single();if(v.error||v.data.image_path!==path)throw new Error('La fotografia non è stata verificata nel database.');say('Fotografia caricata come bozza e verificata.');await loadGallery()}catch(e){say('Errore caricamento: '+e.message)}finally{b.disabled=false}}
async function toggleGallery(x){try{const r=await db.from('gallery_images').update({is_published:!x.is_published}).eq('id',x.id).select('id,is_published').single();if(r.error)throw r.error;if(r.data.is_published===x.is_published)throw new Error('Stato non aggiornato.');say('Stato galleria aggiornato.');await loadGallery()}catch(e){say('Errore: '+e.message)}}
async function deleteGallery(x){if(!confirm('Eliminare il record della fotografia? Il file caricato resta nello spazio media.'))return;try{const r=await db.from('gallery_images').delete().eq('id',x.id).select('id').single();if(r.error)throw r.error;say('Record eliminato. Il file non è stato cancellato.');await loadGallery()}catch(e){say('Errore: '+e.message)}}
async function loadPopup(){say('Caricamento popup…');try{const r=await db.from('homepage_popup').select('*').order('created_at',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('Record popup non trovato.');popup=r.data;const m=Array.isArray(popup.media_files)?popup.media_files:[];$('page-popup').innerHTML='<div class="section"><div class="notice">Il popup viene letto dalla Home Preview. I file caricati vengono salvati nel bucket pubblico site-media e collegati al record esistente. Il pulsante MENU userà i file PDF associati; il contatto usa l’indirizzo email.</div><div class="check" style="margin:14px 0"><input type="checkbox" id="pActive" '+(popup.active?'checked':'')+'><label for="pActive">Popup attivo sulla Home Preview</label></div><div class="grid2"><div><label>Titolo italiano</label><input id="pTitleIt" value="'+esc(popup.title_it)+'"></div><div><label>Titolo inglese</label><input id="pTitleEn" value="'+esc(popup.title_en)+'"></div><div><label>Testo italiano</label><textarea id="pBodyIt">'+esc(popup.body_it)+'</textarea></div><div><label>Testo inglese</label><textarea id="pBodyEn">'+esc(popup.body_en)+'</textarea></div><div><label>Etichetta pulsante IT</label><input id="pButtonIt" value="'+esc(popup.button_label_it)+'"></div><div><label>Etichetta pulsante EN</label><input id="pButtonEn" value="'+esc(popup.button_label_en)+'"></div><div><label>Email contatto</label><input id="pEmail" type="email" value="'+esc(popup.contact_email)+'"></div><div><label>URL esterno del pulsante popup</label><input id="pLinkUrl" type="url" value="'+esc(popup.translations?.it?.link_url||'')+'"></div><div><label>Testo pulsante esterno</label><input id="pLinkLabel" value="'+esc(popup.translations?.it?.link_label||'')+'"></div><div><label>Carica PDF o immagini (max 15 MB ciascuno)</label><input id="pFiles" type="file" multiple accept="application/pdf,image/*"></div></div><h3 style="font:21px Georgia,serif;color:var(--gold);margin-top:18px">File collegati</h3><div id="popupFiles" class="media-grid">'+m.map((f,i)=>'<div class="media-card">'+(String(f.type||'').startsWith('image/')?'<img src="'+esc(f.url||mediaUrl(f.path))+'" alt="">':'<b>PDF · MENU</b>')+'<small>'+esc(f.name||f.path||'File')+'</small><button class="danger" data-p-remove="'+i+'">Rimuovi collegamento</button></div>').join('')+'</div><button id="pSave" class="primary" style="margin-top:15px">Salva popup e file</button><div id="pStatus" class="status"></div></div>';document.querySelectorAll('[data-p-remove]').forEach(b=>b.onclick=()=>{m.splice(Number(b.dataset.pRemove),1);popup.media_files=m;b.closest('.media-card').remove()});$('pSave').onclick=savePopup}catch(e){say('Errore popup: '+e.message)}}
async function savePopup(){const b=$('pSave'),st=$('pStatus');b.disabled=true;st.textContent='Salvataggio…';let media=(popup.media_files||[]).slice();try{const files=[...$('pFiles').files];if(media.length+files.length>8)throw new Error('Massimo 8 file nel popup.');for(const f of files){if(f.size>15*1024*1024)throw new Error('File oltre 15 MB: '+f.name);if(!f.type.startsWith('image/')&&f.type!=='application/pdf')throw new Error('Formato non ammesso: '+f.name);const path=filePath('popup-'+f.name);const u=await db.storage.from('site-media').upload(path,f,{contentType:f.type,upsert:false});if(u.error)throw u.error;media.push({name:f.name,path,url:mediaUrl(path),type:f.type})}const patch={active:$('pActive').checked,title_it:$('pTitleIt').value,title_en:$('pTitleEn').value,body_it:$('pBodyIt').value,body_en:$('pBodyEn').value,button_label_it:$('pButtonIt').value,button_label_en:$('pButtonEn').value,contact_email:$('pEmail').value,translations:{...(popup.translations||{}),it:{...((popup.translations||{}).it||{}),link_url:$('pLinkUrl').value.trim(),link_label:$('pLinkLabel').value.trim()}},media_files:media,updated_at:new Date().toISOString()};const w=await db.from('homepage_popup').update(patch).eq('id',popup.id).select('id').single();if(w.error)throw w.error;const v=await db.from('homepage_popup').select('*').eq('id',popup.id).single();if(v.error)throw v.error;if(v.data.active!==patch.active||stableJSON(v.data.media_files)!==stableJSON(media))throw new Error('Rilettura popup non corrispondente.');popup=v.data;st.textContent='Popup salvato e riletto dal database Test ✓';say('Popup aggiornato. Apri la Home Preview in una nuova scheda per verificarlo.')}catch(e){st.textContent='ERRORE: '+e.message;say('Popup non confermato: '+e.message)}finally{b.disabled=false}}
async function loadMenu(){say('Caricamento menu…');try{const [c,i]=await Promise.all([db.from('menu_categories').select('*').order('sort_order'),db.from('menu_items').select('*').order('sort_order')]);if(c.error)throw c.error;if(i.error)throw i.error;categories=c.data||[];items=i.data||[];$('page-menu').innerHTML='<div class="section"><h3 style="font:21px Georgia,serif;color:var(--gold)">Categorie</h3><div class="row"><input id="catNew" placeholder="Nuova categoria"><button class="primary" id="catAdd">Aggiungi</button></div>'+categories.map(c=>'<div class="item"><div class="meta"><b>'+esc(c.name)+'</b><small>Ordine '+c.sort_order+'</small></div><div class="actions"><button data-cat-pub="'+c.id+'">'+(c.is_published?'Nascondi':'Pubblica')+'</button><button data-cat-edit="'+c.id+'">Rinomina</button></div></div>').join('')+'</div><div class="section"><h3 style="font:21px Georgia,serif;color:var(--gold)">Aggiungi piatto</h3><div class="grid2"><div><label>Nome</label><input id="mName"></div><div><label>Categoria</label><select id="mCat">'+categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div><label>Prezzo (€)</label><input id="mPrice" type="number" step="0.01"></div><div><label>Allergeni (separati da virgola)</label><input id="mAllergens"></div><div class="field"><label>Descrizione</label><textarea id="mDesc"></textarea></div><div><label>Ordine</label><input id="mOrder" type="number" value="0"></div></div><button class="primary" id="mAdd" style="margin-top:12px">Aggiungi piatto</button></div><div class="section"><h3 style="font:21px Georgia,serif;color:var(--gold)">Piatti esistenti</h3>'+items.map(i=>'<div class="item"><div class="meta"><b>'+esc(i.name)+'</b><small>'+esc(categories.find(c=>c.id===i.category_id)?.name||'Senza categoria')+' · '+(i.price??'—')+' € · '+(i.is_published?'Pubblicato':'Bozza')+'</small></div><div class="actions"><button data-m-edit="'+i.id+'">Modifica</button><button data-m-pub="'+i.id+'">'+(i.is_published?'Nascondi':'Pubblica')+'</button></div></div>').join('')+'</div>'; $('catAdd').onclick=addCategory;$('mAdd').onclick=addMenuItem;categories.forEach(c=>{$('[data-cat-pub="'+c.id+'"]').onclick=()=>toggleCategory(c);$('[data-cat-edit="'+c.id+'"]').onclick=()=>renameCategory(c)});items.forEach(i=>{$('[data-m-pub="'+i.id+'"]').onclick=()=>toggleItem(i);$('[data-m-edit="'+i.id+'"]').onclick=()=>editItem(i)})}catch(e){say('Errore menu: '+e.message)}}
async function addCategory(){const name=$('catNew').value.trim();if(!name)return;try{const r=await db.from('menu_categories').insert({name,sort_order:categories.length,is_published:false,translations:{}}).select('id').single();if(r.error)throw r.error;say('Categoria creata come bozza.');await loadMenu()}catch(e){say('Errore categoria: '+e.message)}}
async function renameCategory(c){const name=prompt('Nuovo nome categoria',c.name);if(!name||name===c.name)return;try{const r=await db.from('menu_categories').update({name}).eq('id',c.id).select('id,name').single();if(r.error)throw r.error;say('Categoria aggiornata.');await loadMenu()}catch(e){say('Errore: '+e.message)}}
async function toggleCategory(c){try{const r=await db.from('menu_categories').update({is_published:!c.is_published}).eq('id',c.id).select('id,is_published').single();if(r.error)throw r.error;say('Stato categoria aggiornato.');await loadMenu()}catch(e){say('Errore: '+e.message)}}
async function addMenuItem(){const name=$('mName').value.trim();if(!name){say('Inserisci il nome del piatto.');return}try{const r=await db.from('menu_items').insert({name,category_id:$('mCat').value||null,price:$('mPrice').value?Number($('mPrice').value):null,allergens:$('mAllergens').value.split(',').map(x=>x.trim()).filter(Boolean),description:$('mDesc').value,sort_order:Number($('mOrder').value)||0,is_published:false,translations:{}}).select('id').single();if(r.error)throw r.error;say('Piatto aggiunto come bozza.');await loadMenu()}catch(e){say('Errore piatto: '+e.message)}}
async function editItem(i){const name=prompt('Nome del piatto',i.name);if(name===null)return;const price=prompt('Prezzo (€)',i.price??'');if(price===null)return;const description=prompt('Descrizione',i.description||'');if(description===null)return;try{const r=await db.from('menu_items').update({name,price:price===''?null:Number(price),description}).eq('id',i.id).select('id,name,price').single();if(r.error)throw r.error;say('Piatto aggiornato.');await loadMenu()}catch(e){say('Errore: '+e.message)}}
async function toggleItem(i){try{const r=await db.from('menu_items').update({is_published:!i.is_published}).eq('id',i.id).select('id,is_published').single();if(r.error)throw r.error;say('Stato piatto aggiornato.');await loadMenu()}catch(e){say('Errore: '+e.message)}}
async function loadVideos(){say('Caricamento video…');try{const [p,r]=await Promise.all([db.from('performance_videos').select('*').order('sort_order'),db.from('restaurant_videos').select('*').order('sort_order')]);if(p.error)throw p.error;if(r.error)throw r.error;videoRows=p.data||[];$('page-videos').innerHTML='<div class="section"><h3 style="font:21px Georgia,serif;color:var(--gold)">Video musica dal vivo</h3><div class="grid2"><div><label>Titolo</label><input id="vTitle"></div><div><label>Link video (opzionale)</label><input id="vUrl" type="url"></div><div><label>Carica file video (MP4/WebM)</label><input id="vFile" type="file" accept="video/mp4,video/webm"></div><div><label>Orientamento</label><select id="vOrientation"><option value="landscape">Orizzontale</option><option value="portrait">Verticale</option></select></div></div><button id="vAdd" class="primary" style="margin-top:12px">Aggiungi video come bozza</button></div><div class="section"><h3 style="font:21px Georgia,serif;color:var(--gold)">Video già presenti</h3>'+videoRows.map(v=>'<div class="item"><div class="meta"><b>'+esc(v.title)+'</b><small>'+(v.video_path?'File caricato':esc(v.video_url||'Nessun file'))+' · '+(v.is_published?'Pubblicato':'Bozza')+'</small></div><div class="actions"><button data-v-toggle="'+v.id+'">'+(v.is_published?'Nascondi':'Pubblica')+'</button></div></div>').join('')+'</div><div class="section"><h3 style="font:21px Georgia,serif;color:var(--gold)">Video ambienti</h3><p class="muted">Aggiungi link YouTube o Vimeo nella sezione Video ambienti del sito.</p><label>Titolo</label><input id="rvTitle"><label>URL YouTube / Vimeo</label><input id="rvUrl" type="url"><button id="rvAdd" class="primary" style="margin-top:12px">Aggiungi link video</button><div>'+r.data.map(v=>'<div class="item"><div class="meta"><b>'+esc(v.title)+'</b><small>'+esc(v.youtube_url||v.video_url||'')+'</small></div></div>').join('')+'</div></div>';$('vAdd').onclick=addPerformanceVideo;$('rvAdd').onclick=addRestaurantVideo;videoRows.forEach(v=>{$('[data-v-toggle="'+v.id+'"]').onclick=()=>toggleVideo(v)})}catch(e){say('Errore video: '+e.message)}}
async function addPerformanceVideo(){const file=$('vFile').files?.[0],url=$('vUrl').value.trim(),title=$('vTitle').value.trim();if(!title||(!file&&!url)){say('Inserisci titolo e un file o un URL.');return}try{let path=null;if(file){path=filePath('performance-'+file.name);const u=await db.storage.from('performance-videos').upload(path,file,{contentType:file.type,upsert:false});if(u.error)throw u.error}const r=await db.from('performance_videos').insert({title,video_path:path,video_url:url||null,video_orientation:$('vOrientation').value,is_published:false,sort_order:videoRows.length,translations:{}}).select('id').single();if(r.error)throw r.error;say('Video aggiunto come bozza.');await loadVideos()}catch(e){say('Errore video: '+e.message)}}
async function addRestaurantVideo(){const title=$('rvTitle').value.trim(),url=$('rvUrl').value.trim();if(!title||!url){say('Inserisci titolo e URL.');return}try{const r=await db.from('restaurant_videos').insert({title,youtube_url:url,is_published:false,sort_order:0}).select('id').single();if(r.error)throw r.error;say('Link video aggiunto come bozza.');await loadVideos()}catch(e){say('Errore link: '+e.message)}}
async function toggleVideo(v){try{const r=await db.from('performance_videos').update({is_published:!v.is_published}).eq('id',v.id).select('id,is_published').single();if(r.error)throw r.error;say('Stato video aggiornato.');await loadVideos()}catch(e){say('Errore: '+e.message)}}
async function loadEvents(){say('Caricamento eventi…');try{const r=await db.from('events').select('*').order('starts_at');if(r.error)throw r.error;eventRows=r.data||[];$('page-events').innerHTML='<div class="section"><h3 style="font:21px Georgia,serif;color:var(--gold)">Nuovo evento</h3><div class="grid2"><div><label>Titolo</label><input id="eTitle"></div><div><label>Data e ora</label><input id="eDate" type="datetime-local"></div><div><label>Descrizione</label><textarea id="eDesc"></textarea></div><div><label>Link pulsante</label><input id="eUrl" type="url"></div><div><label>Etichetta pulsante</label><input id="eLabel" value="Scopri l’evento"></div><div><label>Immagine</label><input id="eFile" type="file" accept="image/*"></div></div><button id="eAdd" class="primary" style="margin-top:12px">Crea evento come bozza</button></div><div class="section">'+eventRows.map(v=>'<div class="item"><div class="meta"><b>'+esc(v.title)+'</b><small>'+esc(v.starts_at||'')+' · '+(v.is_published?'Pubblicato':'Bozza')+'</small></div><div class="actions"><button data-e-toggle="'+v.id+'">'+(v.is_published?'Nascondi':'Pubblica')+'</button></div></div>').join('')+'</div>';$('eAdd').onclick=addEvent;eventRows.forEach(v=>{$('[data-e-toggle="'+v.id+'"]').onclick=()=>toggleEvent(v)})}catch(e){say('Errore eventi: '+e.message)}}
async function addEvent(){const title=$('eTitle').value.trim();if(!title){say('Inserisci il titolo evento.');return}try{let path=null;const file=$('eFile').files?.[0];if(file){path=filePath('event-'+file.name);const u=await db.storage.from('site-media').upload(path,file,{contentType:file.type,upsert:false});if(u.error)throw u.error}const r=await db.from('events').insert({title,description:$('eDesc').value,starts_at:$('eDate').value?new Date($('eDate').value).toISOString():null,image_path:path,external_url:$('eUrl').value||null,button_label:$('eLabel').value,is_published:false,translations:{}}).select('id').single();if(r.error)throw r.error;say('Evento creato come bozza.');await loadEvents()}catch(e){say('Errore evento: '+e.message)}}
async function toggleEvent(v){try{const r=await db.from('events').update({is_published:!v.is_published,updated_at:new Date().toISOString()}).eq('id',v.id).select('id,is_published').single();if(r.error)throw r.error;say('Stato evento aggiornato.');await loadEvents()}catch(e){say('Errore: '+e.message)}}
const {data:{session}}=await db.auth.getSession();if(session){try{await enter()}catch(e){await db.auth.signOut();$('loginStatus').textContent=e.message}}
</script>
</body></html>
