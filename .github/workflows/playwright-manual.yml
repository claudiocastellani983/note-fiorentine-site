name: Playwright - verifica manuale sito

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL da testare"
        required: false
        type: string
        default: "https://note-fiorentine-67sendbm6-claudiocastellani983-5675.vercel.app"

permissions:
  contents: read

jobs:
  browser-check:
    name: Test browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload report and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
