name: One-time i18n preview verification

on:
  push:
    branches:
      - fix/full-i18n-2026-11-10
    paths:
      - '.github/workflows/i18n-preview-once.yml'

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_PREVIEW_URL: https://note-fiorentine-git-fix-full-i-c8a79d-claudiacastellani983-5675.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify all six languages on the Vercel preview
        run: npx playwright test tests/i18n-completeness.spec.js --project=chromium
