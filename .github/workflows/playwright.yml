# Live checks are gated by Vercel commit statuses so an older branch alias
# can never produce a false-green result for a newer commit.
name: Playwright E2E

on:
  push:
    branches: [release/integrated-preview-2026-11, 'fix/**', release/i18n-integrated-2026-11-10]
  pull_request:
    branches: [release/integrated-preview-2026-11, main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

# Evita che più run concorrenti cancellino le rispettive fixture temporanee Supabase Test.
concurrency:
  group: note-fiorentine-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-local:
    name: Test locali (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      ADMIN_BASE_URL: http://127.0.0.1:4174

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start local static previews from the PR source
        run: |
          python3 -m http.server 4173 --directory src/src >/tmp/nf-site-preview.log 2>&1 &
          python3 -m http.server 4174 --directory admin >/tmp/nf-admin-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/src/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Le preview statiche locali non si sono avviate."
          cat /tmp/nf-site-preview.log /tmp/nf-admin-preview.log
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run local Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --ignore-snapshots --grep-invert "Preview Vercel reali|Funzioni pubbliche delle preview reali"

      - name: Upload local HTML report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  resolve-current-previews:
    name: Verifica che le preview appartengano al commit corrente
    if: (github.event_name == 'push' && github.ref == 'refs/heads/release/integrated-preview-2026-11') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/integrated-preview-2026-11') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'release/integrated-preview-2026-11')
    runs-on: ubuntu-latest
    outputs:
      admin_ready: ${{ steps.resolve.outputs.admin_ready }}
      all_ready: ${{ steps.resolve.outputs.all_ready }}
      admin_url: ${{ steps.resolve.outputs.admin_url }}
      site_url: ${{ steps.resolve.outputs.site_url }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Resolve Vercel status for this exact commit
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.eventName === "pull_request"
              ? context.payload.pull_request.head.ref
              : (context.ref.startsWith("refs/heads/") ? context.ref.slice(11) : context.ref);
            const expectedHeadSha = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;
            // Le preview sono verificate sullo SHA corrente e raggiunte tramite alias stabile del branch.
            const homeDeploymentSha = expectedHeadSha;
            const adminDeploymentSha = expectedHeadSha;
            // Fallback controllati: Home READY sul commit SEO integrato 21d8b442;
            // Admin READY sul commit 631a74c5. Riutilizziamo ciascuna preview solo
            // se da quel commit non sono cambiati i rispettivi file applicativi.
            const knownHomePreviewSha = "21d8b4425e6f3db03a92e5f4389414c048d889a1";
            const knownAdminPreviewSha = "631a74c535bb74be2a79389f609230a863307740";
            const siteUrl = "https://note-fiorentine-git-release-i1-363e1b-claudiacastellani983-5675.vercel.app/";
            const adminBaseUrl = "https://note-fiorentine-admin-git-rele-1da2a5-claudiacastellani983-5675.vercel.app/";
            const adminUrl = adminBaseUrl + "?sitePreview=" + encodeURIComponent(siteUrl);
            const homeContext = "Vercel – note-fiorentine";
            const adminContext = "Vercel – note-fiorentine-admin";
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            core.setOutput("admin_ready", "false");
            core.setOutput("all_ready", "false");
            let lastReason = "Vercel non ha ancora pubblicato gli status del commit di anteprima.";
            core.info("Commit Home verificato: " + homeDeploymentSha + "; commit Admin verificato: " + adminDeploymentSha);

            for (let attempt = 0; attempt < 15; attempt++) {
              const branchRef = await github.rest.git.getRef({
                owner, repo, ref: "heads/" + branch
              });
              if (branchRef.data.object.sha !== expectedHeadSha) {
                lastReason = "Il ramo è avanzato a un commit più recente; i test live di questo run vengono saltati.";
                core.setOutput("reason", lastReason);
                return;
              }

              const [homeResponse, adminResponse] = await Promise.all([
                github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: homeDeploymentSha, per_page: 100 }),
                github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: adminDeploymentSha, per_page: 100 })
              ]);
              const latestFor = statuses => {
                const latest = new Map();
                for (const status of [...statuses].sort(
                  (a, b) => Date.parse(b.created_at) - Date.parse(a.created_at)
                )) {
                  if (!latest.has(status.context)) latest.set(status.context, status);
                }
                return latest;
              };
              const home = latestFor(homeResponse.data).get(homeContext);
              const admin = latestFor(adminResponse.data).get(adminContext);
              let adminReady = admin?.state === "success";
              let homeReady = home?.state === "success";
              if ((!adminReady && !admin) || (!homeReady && !home)) {
                const [adminCompare, homeCompare] = await Promise.all([
                  github.request("GET /repos/{owner}/{repo}/compare/{basehead}", {
                    owner, repo, basehead: knownAdminPreviewSha + "..." + expectedHeadSha
                  }),
                  github.request("GET /repos/{owner}/{repo}/compare/{basehead}", {
                    owner, repo, basehead: knownHomePreviewSha + "..." + expectedHeadSha
                  })
                ]);
                const adminChanged = adminCompare.data.files || [];
                const homeChanged = homeCompare.data.files || [];
                if (!adminReady && !admin) {
                  const adminCodeUnchanged = adminChanged.every(file => !file.filename.startsWith("admin/"));
                  if (adminCodeUnchanged) {
                    adminReady = true;
                    core.info("Preview Admin riutilizzata: deployment READY al commit " + knownAdminPreviewSha +
                      "; nessun file admin/ è cambiato dopo quel commit.");
                  }
                }
                if (!homeReady && !home) {
                  const homeCodeUnchanged = homeChanged.every(file =>
                    !file.filename.startsWith("src/src/") && !file.filename.startsWith("recovered/site/")
                  );
                  if (homeCodeUnchanged) {
                    homeReady = true;
                    core.info("Preview Home riutilizzata: deployment READY al commit " + knownHomePreviewSha +
                      "; nessun file Home/Menu è cambiato dopo quel commit.");
                  }
                }
              }
              const allReady = adminReady && homeReady;

              if (adminReady) {
                core.setOutput("admin_ready", "true");
                core.setOutput("admin_url", adminUrl);
              }
              if (allReady) {
                core.setOutput("all_ready", "true");
                core.setOutput("site_url", siteUrl);
                core.setOutput("reason", "");
                core.info("Entrambe le preview Vercel risultano READY sul commit " + context.sha);
                return;
              }
              if (adminReady && !homeReady) {
                core.setOutput("reason", "Preview Admin verificata e pronta; nessuna preview Home sul commit dei soli test. Proseguo con il collaudo autenticato Admin.");
                return;
              }

              lastReason = "Home " + homeDeploymentSha.slice(0, 12) + ": " + (home?.state || "in attesa") +
                "; Admin " + adminDeploymentSha.slice(0, 12) + ": " + (admin?.state || "in attesa");
              if (home?.state === "failure" || home?.state === "error") {
                lastReason += "; Vercel segnala un errore di build per Home.";
                if (adminReady) {
                  core.setOutput("reason", lastReason);
                  return;
                }
              }
              if (admin?.state === "failure" || admin?.state === "error") {
                lastReason += "; Vercel segnala un errore di build per Admin.";
                core.setOutput("reason", lastReason);
                return;
              }
              if (attempt < 14) await sleep(20000);
            }

            core.setOutput("reason", "Timeout in attesa delle preview aggiornate. " + lastReason);
            core.warning("Test live saltati: " + lastReason);

  playwright-live-previews:
    needs: resolve-current-previews
    if: needs.resolve-current-previews.outputs.all_ready == 'true'
    name: Preview Vercel reali (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SITE_PREVIEW_URL: ${{ needs.resolve-current-previews.outputs.site_url }}
      ADMIN_PREVIEW_URL: ${{ needs.resolve-current-previews.outputs.admin_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Test live Vercel previews
        run: npx playwright test tests/live-previews.spec.js tests/live-functional.spec.js --project=${{ matrix.browser }}

      - name: Upload live preview report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  playwright-admin-authenticated:
    needs: resolve-current-previews
    if: needs.resolve-current-previews.outputs.admin_ready == 'true'
    name: Admin autenticato e upload Supabase Test
    runs-on: ubuntu-latest
    env:
      ADMIN_PREVIEW_URL: ${{ needs.resolve-current-previews.outputs.admin_url }}
      NF_TEST_ADMIN_EMAIL: ${{ secrets.NF_TEST_ADMIN_EMAIL }}
      NF_TEST_ADMIN_PASSWORD: ${{ secrets.NF_TEST_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verifica credenziali Admin di test
        env:
          NF_TEST_ADMIN_EMAIL: ${{ secrets.NF_TEST_ADMIN_EMAIL }}
          NF_TEST_ADMIN_PASSWORD: ${{ secrets.NF_TEST_ADMIN_PASSWORD }}
        run: |
          if [ -z "$NF_TEST_ADMIN_EMAIL" ] || [ -z "$NF_TEST_ADMIN_PASSWORD" ]; then
            echo "::error::Mancano i secrets NF_TEST_ADMIN_EMAIL e/o NF_TEST_ADMIN_PASSWORD."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Login, test image management and verify Storage cleanup
        run: npx playwright test tests/admin-authenticated.spec.js --project=chromium --workers=1
      - name: Upload Admin test evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-admin-authenticated
          path: |
            playwright-report/
            test-results/
          retention-days: 14
