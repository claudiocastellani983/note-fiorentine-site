# Playwright checks run against the verified coordinated Home/Admin previews.
name: Playwright E2E

on:
  push:
    branches:
      - release/integrated-preview-2026-11
      - test/playwright-preview-validation-2026-11
      - 'fix/**'
  pull_request:
    branches: [release/integrated-preview-2026-11]
  workflow_dispatch:
    inputs:
      site_preview_url:
        description: URL della preview Home Vercel
        required: false
      admin_preview_url:
        description: URL della preview Admin Vercel
        required: false

permissions:
  contents: read

jobs:
  playwright-local:
    name: Test locali (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      ADMIN_BASE_URL: http://127.0.0.1:4174

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start local static previews from the PR source
        run: |
          python3 -m http.server 4173 --directory src/src >/tmp/nf-site-preview.log 2>&1 &
          python3 -m http.server 4174 --directory admin >/tmp/nf-admin-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/src/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Le preview statiche locali non si sono avviate."
          cat /tmp/nf-site-preview.log /tmp/nf-admin-preview.log
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run local Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --ignore-snapshots --grep-invert "Preview Vercel reali|Funzioni pubbliche delle preview reali"

      - name: Upload local HTML report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  playwright-live-previews:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.site_preview_url != '' && github.event.inputs.admin_preview_url != ''
    name: Preview Vercel reali (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SITE_PREVIEW_URL: ${{ github.event.inputs.site_preview_url }}
      ADMIN_PREVIEW_URL: ${{ github.event.inputs.admin_preview_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Test live Vercel previews
        run: npx playwright test tests/live-previews.spec.js tests/live-functional.spec.js --project=${{ matrix.browser }}

      - name: Upload live preview report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  playwright-admin-authenticated:
    name: Admin autenticato e upload Supabase Test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.admin_preview_url != ''
    runs-on: ubuntu-latest
    env:
      ADMIN_PREVIEW_URL: ${{ github.event.inputs.admin_preview_url }}
      NF_TEST_ADMIN_EMAIL: ${{ secrets.NF_TEST_ADMIN_EMAIL }}
      NF_TEST_ADMIN_PASSWORD: ${{ secrets.NF_TEST_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verifica credenziali Admin di test
        env:
          NF_TEST_ADMIN_EMAIL: ${{ secrets.NF_TEST_ADMIN_EMAIL }}
          NF_TEST_ADMIN_PASSWORD: ${{ secrets.NF_TEST_ADMIN_PASSWORD }}
        run: |
          if [ -z "$NF_TEST_ADMIN_EMAIL" ] || [ -z "$NF_TEST_ADMIN_PASSWORD" ]; then
            echo "::error::Mancano i secrets NF_TEST_ADMIN_EMAIL e/o NF_TEST_ADMIN_PASSWORD. Il test autenticato non può essere saltato silenziosamente."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Login, test image management and verify Storage cleanup
        run: npx playwright test tests/admin-authenticated.spec.js --project=chromium
      - name: Upload Admin test evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-admin-authenticated
          path: |
            playwright-report/
            test-results/
          retention-days: 14



  playwright-live-preview-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/playwright-preview-validation-2026-11'
    name: Collaudo Preview reali (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SITE_PREVIEW_URL: https://note-fiorentine-btp0lizuy-claudiocastellani983-5675.vercel.app
      ADMIN_PREVIEW_URL: https://note-fiorentine-admin-arbqhd4yf-claudiocastellani983-5675.vercel.app/?sitePreview=https%3A%2F%2Fnote-fiorentine-btp0lizuy-claudiocastellani983-5675.vercel.app%2F
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test Home e Admin sulle Preview Vercel reali
        run: npx playwright test tests/live-previews.spec.js tests/live-functional.spec.js --project=${{ matrix.browser }}
      - name: Upload live preview report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-preview-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  playwright-admin-authenticated-test-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/playwright-preview-validation-2026-11'
    name: Admin autenticato e upload su Supabase TEST
    runs-on: ubuntu-latest
    env:
      ADMIN_PREVIEW_URL: https://note-fiorentine-admin-arbqhd4yf-claudiocastellani983-5675.vercel.app/?sitePreview=https%3A%2F%2Fnote-fiorentine-btp0lizuy-claudiocastellani983-5675.vercel.app%2F
      NF_TEST_ADMIN_EMAIL: ${{ secrets.NF_TEST_ADMIN_EMAIL }}
      NF_TEST_ADMIN_PASSWORD: ${{ secrets.NF_TEST_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verifica credenziali Admin di test
        env:
          NF_TEST_ADMIN_EMAIL: ${{ secrets.NF_TEST_ADMIN_EMAIL }}
          NF_TEST_ADMIN_PASSWORD: ${{ secrets.NF_TEST_ADMIN_PASSWORD }}
        run: |
          if [ -z "$NF_TEST_ADMIN_EMAIL" ] || [ -z "$NF_TEST_ADMIN_PASSWORD" ]; then
            echo "::error::Mancano i secrets NF_TEST_ADMIN_EMAIL e/o NF_TEST_ADMIN_PASSWORD. Il test autenticato non può essere saltato silenziosamente."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Login, test image management and verify Storage cleanup
        run: npx playwright test tests/admin-authenticated.spec.js --project=chromium
      - name: Upload Admin test evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-admin-authenticated-test-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 14
