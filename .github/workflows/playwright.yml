name: Playwright local and opt-in preview E2E

'on':
  push:
    branches: [release/integrated-preview-2026-11, 'fix/**']
  pull_request:
    branches: [release/integrated-preview-2026-11, main]
  workflow_dispatch:
    inputs:
      run_live_preview_tests:
        description: "Esegui il controllo sulle Preview Vercel correnti (genera richieste HTTP alle Preview)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: note-fiorentine-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-local:
    name: Test locali (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      ADMIN_BASE_URL: http://127.0.0.1:4174

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start local static previews from the PR source
        run: |
          python3 -m http.server 4173 --directory src/src >/tmp/nf-site-preview.log 2>&1 &
          python3 -m http.server 4174 --directory admin >/tmp/nf-admin-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            site_ready=false
            admin_ready=false
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              site_ready=true
            fi
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:4174/src/index.html >/dev/null 2>&1; then
              admin_ready=true
            fi
            if [ "$site_ready" = true ] && [ "$admin_ready" = true ]; then
              echo "Preview statiche locali disponibili (tentativo $attempt)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Le preview statiche locali non si sono avviate entro 30 secondi."
          echo "--- Log Home ---"
          cat /tmp/nf-site-preview.log
          echo "--- Log Admin ---"
          cat /tmp/nf-admin-preview.log
          exit 1

      - name: Install Google Chrome for Playwright
        if: matrix.browser == 'chromium'
        run: npx playwright install --with-deps chrome

      - name: Install Playwright browser
        if: matrix.browser != 'chromium'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run local Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --ignore-snapshots --grep-invert "Preview Vercel reali|Funzioni pubbliche delle preview reali"

      - name: Upload local HTML report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  resolve-current-previews:
    name: Risolvi le Preview Vercel compatibili con questo commit
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == 'refs/heads/release/integrated-preview-2026-11' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.run_live_preview_tests == true)
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      site_url: ${{ steps.resolve.outputs.site_url }}
      admin_url: ${{ steps.resolve.outputs.admin_url }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Risolvi deployment READY e verifica lo SHA dei file Admin
        id: resolve
        uses: actions/github-script@v7
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          script: |
            const branch = context.payload.pull_request?.head?.ref || (context.ref.startsWith('refs/heads/') ? context.ref.slice('refs/heads/'.length) : context.ref);
            const expectedSha = context.payload.pull_request?.head?.sha || context.sha;
            const teamId = 'team_wsIMEKcElZEKzCapp86bIHAc';
            const projects = {
              home: 'prj_0muwzcfZaDU9g7TB29z2gJcEwyKJ',
              admin: 'prj_vOd9XggNYWnUNpj1EgaZnYJ4eb0V'
            };
            const set = (key, value) => core.setOutput(key, value || '');
            set('ready', 'false');

            if (!process.env.VERCEL_TOKEN) {
              set('reason', 'Manca il secret GitHub VERCEL_TOKEN: non posso interrogare in modo affidabile le Preview Vercel.');
              core.warning('Resolver non eseguito: secret VERCEL_TOKEN assente.');
              return;
            }

            async function deployments(projectId) {
              const params = new URLSearchParams({
                projectId,
                teamId,
                target: 'preview',
                limit: '100'
              });
              const response = await fetch('https://api.vercel.com/v6/deployments?' + params, {
                headers: { Authorization: 'Bearer ' + process.env.VERCEL_TOKEN }
              });
              if (!response.ok) throw new Error('Vercel API ' + response.status + ': ' + (await response.text()).slice(0, 500));
              const data = await response.json();
              return (data.deployments || []).filter(d =>
                (d.readyState || d.state) === 'READY' &&
                d.meta?.githubCommitRef === branch &&
                (d.meta?.githubCommitSha || d.gitSource?.sha)
              );
            }

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 0; attempt < 10; attempt++) {
              const [homeList, adminList] = await Promise.all([
                deployments(projects.home),
                deployments(projects.admin)
              ]);

              const home = homeList.find(d =>
                (d.meta?.githubCommitSha || d.gitSource?.sha) === expectedSha
              );

              let compatibleAdmin = null;
              const candidates = adminList.sort((a, b) =>
                (b.createdAt || b.created || 0) - (a.createdAt || a.created || 0)
              );

              for (const candidate of candidates) {
                const adminSha = candidate.meta?.githubCommitSha || candidate.gitSource?.sha;
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: adminSha + '...' + expectedSha
                });
                if (!['ahead', 'identical'].includes(comparison.data.status)) continue;
                const changed = comparison.data.files || [];
                const adminRelevantChange = changed.some(file =>
                  file.filename.startsWith('admin/') || file.filename.startsWith('supabase/')
                );
                if (!adminRelevantChange) {
                  compatibleAdmin = candidate;
                  break;
                }
              }

              if (home && compatibleAdmin) {
                const siteUrl = 'https://' + home.url + '/';
                const adminBase = 'https://' + compatibleAdmin.url + '/src/index.html';
                const adminUrl = adminBase + '?sitePreview=' + encodeURIComponent(siteUrl);
                set('site_url', siteUrl);
                set('admin_url', adminUrl);
                set('ready', 'true');
                set('reason', 'Home sul commit esatto; Admin READY e senza modifiche admin/ o supabase/ dal proprio commit.');
                core.info('Home Preview: ' + home.url + ' (' + expectedSha + ')');
                core.info('Admin Preview: ' + compatibleAdmin.url + ' (' +
                  (compatibleAdmin.meta?.githubCommitSha || compatibleAdmin.gitSource?.sha) + ')');
                return;
              }

              const reason = 'Home esatta: ' + (home ? 'READY' : 'in attesa') +
                '; Admin compatibile: ' + (compatibleAdmin ? 'READY' : 'non ancora disponibile');
              set('reason', reason);
              core.info(reason);
              if (attempt < 9) await sleep(15000);
            }

            core.warning('Preview non risolte: ' + (process.env.GITHUB_OUTPUT ? 'vedere output reason' : 'timeout'));

  playwright-live-previews:
    needs: resolve-current-previews
    if: needs.resolve-current-previews.outputs.ready == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.run_live_preview_tests == true))
    name: Preview Vercel reali (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SITE_PREVIEW_URL: ${{ needs.resolve-current-previews.outputs.site_url }}
      ADMIN_PREVIEW_URL: ${{ needs.resolve-current-previews.outputs.admin_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ADMIN_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.ADMIN_VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Test live Home and Admin previews
        run: npx playwright test tests/live-previews.spec.js --project=${{ matrix.browser }}

      - name: Upload live preview report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
