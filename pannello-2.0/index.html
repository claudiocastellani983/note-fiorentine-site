async function saveVisual(){if(!visualSelected){$('visualStatus').textContent='Seleziona prima un elemento.';return}applyVisual();const key=visualPage+'::'+visualSelected;const patch={text:$('visualText').value,fontSize:$('visualSize').value+'px',textAlign:$('visualAlign').value,color:$('visualColor').value,fontFamily:$('visualFont').value};visualStyles[key]=patch;const next={...siteData,_visual_styles:visualStyles};$('visualStatus').textContent='Salvataggio su Test…';try{const w=await db.from('site_content').update({content_value:next,updated_at:new Date().toISOString()}).eq('content_key','public_site').select('content_key').single();if(w.error)throw w.error;const v=await db.from('site_content').select('content_value').eq('content_key','public_site').single();if(v.error)throw v.error;siteData=v.data.content_value;visualStyles=siteData._visual_styles||{};if(!visualStyles[key])throw new Error('Stile non presente nella rilettura.');$('visualStatus').textContent='Dati riletti. Ricarico la Home Preview…';const f=$('visualFrame');f.src=HOME_PREVIEW+'?visual-editor=1&visualPage='+encodeURIComponent(visualPage)+'&lang=it&v='+Date.now();const wait=()=>new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('La Home Preview non ha restituito il rapporto di applicazione entro 12 secondi.'))}},12000);const handler=ev=>{if(ev.source===f.contentWindow&&ev.data?.type==='nf-visual-load-report'){done=true;clearTimeout(timer);window.removeEventListener('message',handler);resolve(ev.data.report)}};window.addEventListener('message',handler)});const report=await wait();if(!report||report.applied<1)throw new Error('La Home Preview non conferma l’applicazione degli stili.');$('visualStatus').textContent='Salvato e applicato alla Home Preview ✓ ('+report.applied+'/'+report.total+')';say('Editor visuale: salvataggio e applicazione verificati.')}catch(e){$('visualStatus').textContent='ERRORE / VERIFICA INCOMPLETA: '+e.message;say('Modif async function loadGallery(){say('Caricamento galleria…');try{const r=await db.from('gallery_images').select('*').order('category').order('sort_order');if(r.error)throw r.error;gallery=r.data||[];$('page-gallery').innerHTML='<div class="section"><h3>Aggiungi fotografia</h3><div class="grid2"><div><label>Titolo / nome file</label><input id="gTitle"></div><div><label>Categoria</label><select id="gCategory"><option value="restaurant">Ristorante</option><option value="kitchen">Cucina</option><option value="music">Musica</option></select></div><div><label>Ordine</label><input id="gOrder" type="number" value="10"></div><div><label>Immagine</label><input id="gFile" type="file" accept="image/*"></div></div><button class="primary" id="gAdd" style="margin-top:12px">Carica in galleria</button></div><div class="media-grid">'+gallery.map(x=>'<div class="media-card"><img src="'+esc(mediaUrl(x.image_path))+'" alt=""><b>'+esc(x.title||'Fotografia')+'</b><small>'+esc(x.category)+' · ordine '+x.sort_order+' · '+(x.is_published?'Pubblicata':'Bozza')+'</small><div class="actions"><button data-g-toggle="'+x.id+'">'+(x.is_published?'Nascondi':'Pubblica')+'</button><button class="danger" data-g-delete="'+x.id+'">Elimina record</button></div></div>').join('')+'</div>';$('gAdd').onclick=addGallery;gallery.forEach(x=>{$('[data-g-toggle="'+x.id+'"]').onclick=()=>toggleGallery(x);$('[data-g-delete="'+x.id+'"]').onclick=()=>deleteGallery(x)})}catch(e){say('Errore galleria: '+e.message)}}

async function addRestaurantVideo(){const title=$('rvTitle').value.trim(),url=$('rvUrl').value.trim();if(!title||!url){say('Inserisci titolo e URL.');return}try{const r=await db.from('restaurant_videos').insert({title,youtube_url:url,is_published:false,sort_order:0}).select('id').single();if(r.error)throw r.error;say('Link video aggiunto come bozza.');await loadVideos()}catch(e){say('Errore link: '+e.message)}}
async function toggleVideo(v){try{const r=await db.from('performance_videos').update({is_published:!v.is_published}).eq('id',v.id).select('id,is_published').single();if(r.error)throw r.error;say('Stato video aggiornato.');await loadVideos()}catch(e){say('Errore: '+e.message)}}
async function loadEvents(){say('Caricamento eventi…');try{const r=await db.from('events').select('*').order('starts_at');if(r.error)throw r.error;eventRows=r.data||[];$('page-events').innerHTML='<div class="section"><h3 style="font:21px Georgia,serif;color:var(--gold)">Nuovo evento</h3><div class="grid2"><div><label>Titolo</label><input id="eTitle"></div><div><label>Data e ora</label><input id="eDate" type="datetime-local"></div><div><label>Descrizione</label><textarea id="eDesc"></textarea></div><div><label>Link pulsante</label><input id="eUrl" type="url"></div><div><label>Etichetta pulsante</label><input id="eLabel" value="Scopri l’evento"></div><div><label>Immagine</label><input id="eFile" type="file" accept="image/*"></div></div><button id="eAdd" class="primary" style="margin-top:12px">Crea evento come bozza</button></div><div class="section">'+eventRows.map(v=>'<div class="item"><div class="meta"><b>'+esc(v.title)+'</b><small>'+esc(v.starts_at||'')+' · '+(v.is_published?'Pubblicato':'Bozza')+'</small></div><div class="actions"><button data-e-toggle="'+v.id+'">'+(v.is_published?'Nascondi':'Pubblica')+'</button></div></div>').join('')+'</div>';$('eAdd').onclick=addEvent;eventRows.forEach(v=>{$('[data-e-toggle="'+v.id+'"]').onclick=()=>toggleEvent(v)})}catch(e){say('Errore eventi: '+e.message)}}
async function addEvent(){const title=$('eTitle').value.trim();if(!title){say('Inserisci il titolo evento.');return}try{let path=null;const file=$('eFile').files?.[0];if(file){path=filePath('event-'+file.name);const u=await db.storage.from('site-media').upload(path,file,{contentType:file.type,upsert:false});if(u.error)throw u.error}const r=await db.from('events').insert({title,description:$('eDesc').value,starts_at:$('eDate').value?new Date($('eDate').value).toISOString():null,image_path:path,external_url:$('eUrl').value||null,button_label:$('eLabel').value,is_published:false,translations:{}}).select('id').single();if(r.error)throw r.error;say('Evento creato come bozza.');await loadEvents()}catch(e){say('Errore evento: '+e.message)}}
async function toggleEvent(v){try{const r=await db.from('events').update({is_published:!v.is_published,updated_at:new Date().toISOString()}).eq('id',v.id).select('id,is_published').single();if(r.error)throw r.error;say('Stato evento aggiornato.');await loadEvents()}catch(e){say('Errore: '+e.message)}}
const {data:{session}}=await db.auth.getSession();if(session){try{await enter()}catch(e){await db.auth.signOut();$('loginStatus').textContent=e.message}}
</script>
</body></html>
